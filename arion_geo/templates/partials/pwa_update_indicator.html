<div class="pwa-update-menu pwa-update-menu--{{ placement|default:'desktop' }}" data-pwa-update-menu hidden>
  <button class="pwa-update-indicator" type="button" data-pwa-update-indicator aria-controls="pwa-update-popover-{{ placement|default:'desktop' }}" aria-expanded="false">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12V3m0 0L4.5 6.5M8 3l3.5 3.5"/></svg>
    <span>Atualiza&ccedil;&atilde;o dispon&iacute;vel</span>
    <small data-pwa-indicator-version></small>
  </button>
  <div class="pwa-update-popover" id="pwa-update-popover-{{ placement|default:'desktop' }}" data-pwa-update-popover hidden>
    <strong>Nova vers&atilde;o do ARION</strong>
    <span data-pwa-popover-version></span>
    <span class="pwa-update-popover__status" data-pwa-update-status hidden></span>
    <div class="pwa-update-popover__actions">
      <a href="{% url 'configuracoes:documentation-releases' %}">Ver novidades</a>
      <button type="button" data-pwa-update-accept>Atualizar agora</button>
    </div>
  </div>
</div>
